<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="225mm"
   height="250mm"
   viewBox="0 0 225 250"
   xmlns="http://www.w3.org/2000/svg"
   role="img"
   aria-labelledby="logoTitle logoDesc"
   shape-rendering="geometricPrecision">
  <title id="logoTitle">lawdev.ai logo</title>
  <desc id="logoDesc">Geometric lawdev mark with realistic 3D lighting.</desc>

  <defs>
    <!-- Face gradients - key light upper-left, ~50deg elevation -->
    <linearGradient id="gTopL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3f4a5a"/>
      <stop offset="25%"  stop-color="#363f4e"/>
      <stop offset="55%"  stop-color="#2d3542"/>
      <stop offset="100%" stop-color="#252d38"/>
    </linearGradient>
    <linearGradient id="gTopR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#343c4a"/>
      <stop offset="30%"  stop-color="#2c3440"/>
      <stop offset="65%"  stop-color="#232b36"/>
      <stop offset="100%" stop-color="#1c242e"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0%" y1="5%" x2="100%" y2="95%">
      <stop offset="0%"   stop-color="#2a3240"/>
      <stop offset="25%"  stop-color="#242a34"/>
      <stop offset="55%"  stop-color="#1d2229"/>
      <stop offset="100%" stop-color="#151a22"/>
    </linearGradient>
    <linearGradient id="gLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3a4252"/>
      <stop offset="50%"  stop-color="#313a48"/>
      <stop offset="100%" stop-color="#282f3c"/>
    </linearGradient>
    <linearGradient id="gRight" x1="92%" y1="3%" x2="8%" y2="97%">
      <stop offset="0%"   stop-color="#222a34"/>
      <stop offset="25%"  stop-color="#1b2028"/>
      <stop offset="55%"  stop-color="#141920"/>
      <stop offset="100%" stop-color="#0c1018"/>
    </linearGradient>
    <linearGradient id="gRightFace" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#2a3240"/>
      <stop offset="50%"  stop-color="#232a36"/>
      <stop offset="100%" stop-color="#1c2430"/>
    </linearGradient>

    <!-- Edge / effect gradients -->
    <linearGradient id="gEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#646e82"/>
      <stop offset="35%"  stop-color="#4e5768"/>
      <stop offset="100%" stop-color="#2c3340"/>
    </linearGradient>
    <linearGradient id="gScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="36%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="46%"  stop-color="#d4daf0" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#f0f4ff" stop-opacity="1"/>
      <stop offset="54%"  stop-color="#d4daf0" stop-opacity="0.6"/>
      <stop offset="64%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- AO crease -->
    <linearGradient id="gCrease" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#090b10" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060810" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="gHotspot" cx="22%" cy="18%" r="48%"
      gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="15%"  stop-color="#d0d8f0" stop-opacity="0.05"/>
      <stop offset="45%"  stop-color="#8894b0" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBounce" cx="55%" cy="88%" r="50%">
      <stop offset="0%"   stop-color="#c8a878" stop-opacity="0.025"/>
      <stop offset="40%"  stop-color="#a08860" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip paths for face overlays -->
    <clipPath id="clipLeft">
      <path d="M -11.050004,221.07293 l -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 Z"/>
    </clipPath>
    <clipPath id="clipRight">
      <path d="M 168.94999,151.07293 l -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 Z"/>
    </clipPath>

    <!-- Multi-layer shadow -->
    <filter id="fShadow" x="-50%" y="-40%" width="200%" height="195%">
      <feDropShadow dx="0"  dy="6"   stdDeviation="10"  flood-color="#0a0608" flood-opacity="0.32"/>
      <feDropShadow dx="1.5" dy="3.5" stdDeviation="4.5" flood-color="#080506" flood-opacity="0.24"/>
      <feDropShadow dx="0.3" dy="1"   stdDeviation="1"   flood-color="#0c0808" flood-opacity="0.20"/>
    </filter>

    <!-- Ambient glow -->
    <filter id="fGlow" x="-26%" y="-26%" width="152%" height="152%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#506080" flood-opacity="0.055"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#8090b4" flood-opacity="0.09"/>
    </filter>

    <!-- Dual-light specular -->
    <filter id="fDualSpec" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="bevel"/>
      <feSpecularLighting in="bevel" surfaceScale="4"
        specularConstant="0.55" specularExponent="52"
        lighting-color="#d0d8ee" result="specKey">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specKey" in2="SourceAlpha" operator="in" result="keyClip"/>
      <feSpecularLighting in="bevel" surfaceScale="2.5"
        specularConstant="0.22" specularExponent="30"
        lighting-color="#e8d0b0" result="specFill">
        <feDistantLight azimuth="45" elevation="28"/>
      </feSpecularLighting>
      <feComposite in="specFill" in2="SourceAlpha" operator="in" result="fillClip"/>
      <feComposite in="keyClip" in2="fillClip" operator="arithmetic"
        k1="0" k2="1" k3="0.55" k4="0"/>
    </filter>

    <!-- Fresnel rim-light -->
    <filter id="fFresnel" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="wideBlur"/>
      <feSpecularLighting in="wideBlur" surfaceScale="2"
        specularConstant="0.28" specularExponent="12"
        lighting-color="#8896b8" result="fresnel">
        <feDistantLight azimuth="180" elevation="18"/>
      </feSpecularLighting>
      <feComposite in="fresnel" in2="SourceAlpha" operator="in"/>
    </filter>

    <!-- Surface grain: macro -->
    <filter id="fGrainMacro" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8 1.2"
        numOctaves="3" seed="7" result="macro"/>
      <feColorMatrix in="macro" type="saturate" values="0" result="monoM"/>
      <feComponentTransfer in="monoM" result="faintM">
        <feFuncA type="linear" slope="0.022"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintM" mode="overlay"/>
    </filter>

    <!-- Surface grain: micro -->
    <filter id="fGrainMicro" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.5 4.0"
        numOctaves="4" seed="42" result="micro"/>
      <feColorMatrix in="micro" type="saturate" values="0" result="monoU"/>
      <feComponentTransfer in="monoU" result="faintU">
        <feFuncA type="linear" slope="0.025"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintU" mode="overlay"/>
    </filter>
  </defs>

  <style>
    .spec-layer    { mix-blend-mode: screen; opacity: 0.22; }
    .fresnel-layer { mix-blend-mode: screen; opacity: 0.14; }
    .grain-macro   { opacity: 0.38; }
    .grain-micro   { opacity: 0.30; }
    .ao-crease {
      fill: none;
      stroke: url(#gCrease);
      stroke-width: 1;
      stroke-linecap: round;
    }
    .edge-rim {
      fill: none;
      stroke: url(#gEdge);
      stroke-width: 1.3;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: 0.30;
      animation: edgePulse 6.5s ease-in-out infinite;
    }
    .scan-sweep {
      fill: none;
      stroke: url(#gScan);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 55 730;
      stroke-dashoffset: 0;
      opacity: 0.78;
      animation: scanSweep 7.5s linear infinite;
    }
    @keyframes edgePulse {
      0%, 100% { opacity: 0.14; }
      50%      { opacity: 0.48; }
    }
    @keyframes scanSweep {
      0%   { stroke-dashoffset: 0;    opacity: 0; }
      8%   { opacity: 0.78; }
      68%  { opacity: 0.78; }
      100% { stroke-dashoffset: -790; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .edge-rim   { animation: none; opacity: 0.30; }
      .scan-sweep { animation: none; opacity: 0; }
    }
  </style>

  <g transform="translate(11.050007,-21.072922)">

    <!-- L0: Deep shadow -->
    <g filter="url(#fShadow)">
      <path fill="#06090f" opacity="0.95"
        d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>
    </g>

    <!-- L1: Base fills -->
    <g filter="url(#fGlow)">
      <!-- Crown left slope -->
      <path fill="url(#gTopL)"
        d="M -11.050004,86.072924 L 103.94999,21.072922 L 103.94999,61.072923 L -11.050004,126.07292 Z"/>
      <!-- Crown right slope -->
      <path fill="url(#gTopR)"
        d="M 103.94999,21.072922 L 213.94999,86.072926 L 213.94999,126.07293 L 103.94999,61.072923 Z"/>
      <!-- Left section -->
      <path fill="url(#gLeft)"
        d="M -11.050004,221.07293 l -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 Z"/>
      <!-- Right section -->
      <path fill="url(#gRight)"
        d="M 168.94999,151.07293 l -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 Z"/>
    </g>

    <!-- L1b: Face overlays (clipped vertical fold lines) -->
    <g clip-path="url(#clipLeft)">
      <rect fill="url(#gLeftFace)" x="-200" y="0" width="307" height="400"/>
    </g>
    <g clip-path="url(#clipRight)">
      <rect fill="url(#gRightFace)" x="-200" y="0" width="369" height="400"/>
    </g>

    <!-- L2: AO crease at crown fold -->
    <path class="ao-crease"
      d="M 103.94999,21.072922 L 103.94999,61.072923"/>

    <!-- L3: Dual-light specular -->
    <g class="spec-layer">
      <path fill="#1a1d24" filter="url(#fDualSpec)"
        d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>
    </g>

    <!-- L3: Fresnel rim -->
    <g class="fresnel-layer">
      <path fill="#1a1d24" filter="url(#fFresnel)"
        d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>
    </g>

    <!-- L4: Specular hot-spot -->
    <path fill="url(#gHotspot)"
      d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>

    <!-- L5: Environment ground-bounce -->
    <path fill="url(#gBounce)"
      d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>

    <!-- L6: Surface grain macro -->
    <g class="grain-macro">
      <path fill="url(#gLeft)" filter="url(#fGrainMacro)"
        d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>
    </g>

    <!-- L7: Surface grain micro -->
    <g class="grain-micro">
      <path fill="url(#gLeft)" filter="url(#fGrainMicro)"
        d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>
    </g>

    <!-- L8: Edge rim-light -->
    <path class="edge-rim"
      d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>

    <!-- L9: Scan-line sweep -->
    <path class="scan-sweep"
      d="m -11.050004,221.07293 -3e-6,-45 109.999996,50 v -10 l -109.999993,-50 v -25.00001 l 44.999998,-25 -3e-6,30.00001 69.999999,30 v -50.00001 l 55,30.00001 v 85 l -55,30 z m 179.999994,-70 -70.000001,-40 -44.999998,25 3e-6,-40.000006 44.999998,-25.000001 109.999998,65.000007 v 70 l -40,25 z M -11.050004,86.072924 103.94999,21.072922 l 110,65.000004 v 40.000004 l -110,-65.000007 -114.999994,64.999997 z"/>

  </g>
</svg>
