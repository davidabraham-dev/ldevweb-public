<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" aria-labelledby="logoTitle logoDesc" shape-rendering="geometricPrecision" viewBox="0 0 1200 1200">
  <title id="logoTitle">lawdev.ai logo</title>
  <desc id="logoDesc">Geometric lawdev mark with realistic 3D depth, directional lighting and surface detail.</desc>
  <defs>
    <linearGradient id="gTop" x1="12%" x2="88%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#2e3340"/>
      <stop offset="28%" stop-color="#292e38"/>
      <stop offset="62%" stop-color="#23272f"/>
      <stop offset="100%" stop-color="#1d2128"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="5%" x2="95%" y1="12%" y2="88%">
      <stop offset="0%" stop-color="#282c34"/>
      <stop offset="32%" stop-color="#22262d"/>
      <stop offset="68%" stop-color="#1c2027"/>
      <stop offset="100%" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="gRight" x1="88%" x2="12%" y1="8%" y2="92%">
      <stop offset="0%" stop-color="#23272e"/>
      <stop offset="30%" stop-color="#1d2128"/>
      <stop offset="65%" stop-color="#171a21"/>
      <stop offset="100%" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="gEdge" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#555d70"/>
      <stop offset="45%" stop-color="#434a58"/>
      <stop offset="100%" stop-color="#2e3440"/>
    </linearGradient>
    <linearGradient id="gScan" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="47%" stop-color="#dce2f0" stop-opacity=".7"/>
      <stop offset="50%" stop-color="#f4f7ff"/>
      <stop offset="53%" stop-color="#dce2f0" stop-opacity=".7"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gSpec" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="30%" stop-color="#b8c2d8" stop-opacity=".03"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <filter id="fShadow" width="180%" height="175%" x="-40%" y="-30%">
      <feDropShadow dx="0" dy="14" flood-color="#000" flood-opacity=".28" stdDeviation="24"/>
      <feDropShadow dx="4" dy="8" flood-color="#000" flood-opacity=".2" stdDeviation="10"/>
      <feDropShadow dx="1" dy="3" flood-color="#000" flood-opacity=".16" stdDeviation="3"/>
    </filter>
    <filter id="fGlow" width="144%" height="144%" x="-22%" y="-22%">
      <feDropShadow dx="0" dy="0" flood-color="#6b7a9c" flood-opacity=".07" stdDeviation="10"/>
      <feDropShadow dx="0" dy="0" flood-color="#98a6c4" flood-opacity=".12" stdDeviation="3.5"/>
    </filter>
    <filter id="fSpecular" width="116%" height="116%" x="-8%" y="-8%">
      <feGaussianBlur in="SourceAlpha" result="bevel" stdDeviation="4"/>
      <feSpecularLighting in="bevel" lighting-color="#c0cae0" result="spec" specularConstant=".5" specularExponent="28" surfaceScale="3.5">
        <feDistantLight azimuth="225" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="fGrain" width="100%" height="100%" x="0%" y="0%">
      <feTurbulence baseFrequency="1.1" numOctaves="3" result="noise" seed="42" type="fractalNoise"/>
      <feColorMatrix in="noise" result="mono" type="saturate" values="0"/>
      <feComponentTransfer in="mono" result="faint">
        <feFuncA slope=".04" type="linear"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="overlay"/>
    </filter>
    <!-- Reusable combined shape (all 3 faces) -->
    <path id="shape" d="M-1613.8 3004.3v-240.5l756.63 343.58v-68.72l-756.63-343.58v-206.15l275.14-160.13V2592l515.88 240.5v-446.64l412.7 206.14v584.08l-412.7 189.54Zm1272.5 103.08v-549.73l-481.48-240.5-344.76 190.42v-305l344.76-194.65 791.02 446.66v515.37ZM-1613.8 2111l791.02-446.65L-31.76 2111v274.86l-791.02-446.65-791.02 446.65Z"/>
  </defs>
  <style>
    @keyframes edgePulse{0%,to{opacity:.18}50%{opacity:.56}}@keyframes scanSweep{0%{stroke-dashoffset:0;opacity:0}12%,72%{opacity:.85}to{stroke-dashoffset:-2370;opacity:0}}.edge-rim,.scan-sweep{fill:none;stroke:url(#gEdge);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;opacity:.38;animation:edgePulse 5.5s ease-in-out infinite;will-change:opacity;transform:translateZ(0)}.scan-sweep{stroke:url(#gScan);stroke-width:11;stroke-dasharray:170 2200;stroke-dashoffset:0;opacity:.68;animation:scanSweep 6.3s linear infinite;will-change:opacity,stroke-dashoffset}.spec-overlay{mix-blend-mode:screen;opacity:.18}.grain-overlay{opacity:.45}@media (prefers-reduced-motion:reduce){.edge-rim,.scan-sweep{animation:none;will-change:auto}}
  </style>
  <!-- Layer 0: Deep shadow -->
  <g filter="url(#fShadow)" transform="translate(2386.33 3194.27)">
    <path fill="#080a0f" d="M-2338.33-2252.47v-168l528 240v-48l-528-240v-144l192-111.86v183.86l360 168v-312l288 144v408l-288 132.4Zm888 72v-384l-336-168-240.58 133.02v-213.05l240.62-136 552.27 312v360Zm-888-696 552-312 552 312v192l-552-312-552 312Z" opacity=".92"/>
  </g>
  <!-- Layer 1: Face fills (separate paths for directional lighting) -->
  <g filter="url(#fGlow)" transform="translate(2386.33 3194.27)">
    <path fill="url(#gLeft)" d="M-1613.8 3004.3v-240.5l756.63 343.58v-68.72l-756.63-343.58v-206.15l275.14-160.13V2592l515.88 240.5v-446.64l412.7 206.14v584.08l-412.7 189.54Z" transform="matrix(.69784 0 0 .69853 -1212.16 -4351.06)"/>
    <path fill="url(#gRight)" d="M-341.3 3107.38v-549.73l-481.48-240.5-344.76 190.42v-305l344.76-194.65 791.02 446.66v515.37Z" transform="matrix(.69784 0 0 .69853 -1212.16 -4351.06)"/>
    <path fill="url(#gTop)" d="m-1613.8 2111 791.02-446.65L-31.76 2111v274.86l-791.02-446.65-791.02 446.65Z" transform="matrix(.69784 0 0 .69853 -1212.16 -4351.06)"/>
  </g>
  <!-- Layers 2–6: use shared #shape with per-layer styling -->
  <use href="#shape" fill="#1a1d24" class="spec-overlay" filter="url(#fSpecular)" transform="matrix(.69784 0 0 .69853 1174.17 -1156.8)"/>
  <use href="#shape" fill="url(#gSpec)" transform="matrix(.69784 0 0 .69853 1174.17 -1156.8)"/>
  <use href="#shape" fill="url(#gLeft)" class="grain-overlay" filter="url(#fGrain)" transform="matrix(.69784 0 0 .69853 1174.17 -1156.8)"/>
  <use href="#shape" class="edge-rim" transform="matrix(.69784 0 0 .69853 1174.17 -1156.8)"/>
  <use href="#shape" class="scan-sweep" transform="matrix(.69784 0 0 .69853 1174.17 -1156.8)"/>
</svg>
