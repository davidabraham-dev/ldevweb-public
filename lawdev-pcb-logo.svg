<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="1200"
   height="1200"
   viewBox="0 0 1200 1200"
   xmlns="http://www.w3.org/2000/svg"
   role="img"
   aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">lawdev.ai logo</title>
  <desc id="logoDesc">Geometric lawdev mark with subtle premium scan and pulse effects.</desc>
  <defs>
    <linearGradient id="logoFill" x1="10%" y1="8%" x2="89%" y2="92%">
      <stop offset="0%" stop-color="#0f1013"/>
      <stop offset="52%" stop-color="#272a30"/>
      <stop offset="100%" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff00"/>
      <stop offset="45%" stop-color="#ffffff00"/>
      <stop offset="52%" stop-color="#f4f7ff"/>
      <stop offset="59%" stop-color="#ffffff00"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </linearGradient>
    <filter id="logoGlow" x="-22%" y="-22%" width="144%" height="144%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#aab6d2" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.34"/>
    </filter>
  </defs>
  <style>
    .logo-main {
      fill: url(#logoFill);
      filter: url(#logoGlow);
    }
    .logo-edge {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 8;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: 0.56;
      animation: edgePulse 5.5s ease-in-out infinite;
    }
    .logo-scan {
      fill: none;
      stroke: url(#scanLine);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 170 2200;
      stroke-dashoffset: 0;
      opacity: 0.74;
      animation: scanSweep 6.3s linear infinite;
    }
    @keyframes edgePulse {
      0%, 100% { opacity: 0.24; }
      50% { opacity: 0.74; }
    }
    @keyframes scanSweep {
      0% { stroke-dashoffset: 0; opacity: 0; }
      12% { opacity: 0.94; }
      72% { opacity: 0.94; }
      100% { stroke-dashoffset: -2370; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-edge,
      .logo-scan {
        animation: none;
      }
    }
  </style>
